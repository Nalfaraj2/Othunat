<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أذونات — Components</title>
<link rel="stylesheet" href="tokens.css"><style>@font-face{font-family:Tajawal;src:url("../05_Fonts/Tajawal-Light.ttf");font-weight:300}@font-face{font-family:Tajawal;src:url("../05_Fonts/Tajawal-Regular.ttf");font-weight:400}@font-face{font-family:Tajawal;src:url("../05_Fonts/Tajawal-Medium.ttf");font-weight:500}@font-face{font-family:Tajawal;src:url("../05_Fonts/Tajawal-Bold.ttf");font-weight:700}@font-face{font-family:Tajawal;src:url("../05_Fonts/Tajawal-ExtraBold.ttf");font-weight:800} body{font-family:Tajawal;background:var(--idh-mist);padding:40px;display:flex;flex-direction:column;gap:22px} .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}</style></head><body>
<h1 style="font-weight:800">مكونات أذونات</h1>
<div class="row"><button class="idh-btn idh-btn--primary " ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/><path d="M12 8v4l3 2"/></svg><span>تقديم طلب استئذان</span></button><button class="idh-btn idh-btn--secondary " ><span>حفظ كمسودة</span></button><button class="idh-btn idh-btn--ghost " ><span>إلغاء</span></button><button class="idh-btn idh-btn--approve " ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.2 9.6"/></svg><span>موافقة</span></button><button class="idh-btn idh-btn--reject " ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>رفض</span></button><button class="idh-btn idh-btn--primary " disabled><span>إرسال</span></button></div>
<div class="row"><button class="idh-btn idh-btn--primary idh-btn--lg" ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>طلب جديد</span></button><button class="idh-btn idh-btn--primary " ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>طلب جديد</span></button><button class="idh-btn idh-btn--primary idh-btn--sm" ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>طلب جديد</span></button><button class="idh-btn idh-btn--primary idh-fab" aria-label="طلب جديد"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="row"><span class="idh-chip idh-chip--approved">معتمد</span><span class="idh-chip idh-chip--pending">قيد المراجعة</span><span class="idh-chip idh-chip--rejected">مرفوض</span>
<div class="idh-seg"><button aria-pressed="true">خروج مبكر</button><button>تأخير</button><button>أثناء الدوام</button></div></div>
<script>document.querySelectorAll('.idh-seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));</script>
</body></html>
